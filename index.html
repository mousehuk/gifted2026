<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영재설문 응답 플랫폼</title>
<style>
  :root { --main:#4f46e5; --main-d:#4338ca; --soft:#eef2ff; --line:#e2e8f0; --text:#1e293b; --sub:#64748b; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f8fafc; color:var(--text); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; line-height:1.5; }
  header { background:var(--main); color:#fff; transition:background .3s; }
  .wrap { max-width:880px; margin:0 auto; padding:0 16px; }
  header .wrap { display:flex; justify-content:space-between; align-items:center; padding-top:14px; padding-bottom:14px; gap:8px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; cursor:pointer; }
  header nav { display:flex; gap:6px; flex-wrap:wrap; }
  header nav button { background:rgba(255,255,255,.15); color:#fff; border:none; padding:7px 12px; border-radius:8px; font-size:14px; cursor:pointer; font-family:inherit; }
  header nav button:hover { background:rgba(255,255,255,.25); }
  main.wrap { padding-top:28px; padding-bottom:60px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:16px; }
  h2 { font-size:22px; margin:0 0 6px; }
  h3 { font-size:17px; margin:0 0 12px; }
  .sub { color:var(--sub); font-size:14px; }
  label.f { display:block; font-weight:600; font-size:14px; margin:14px 0 6px; }
  input[type=text], input[type=password], input[type=date], textarea, select {
    width:100%; padding:10px 12px; border:1px solid #cbd5e1; border-radius:10px; font-size:15px; font-family:inherit; background:#fff;
  }
  textarea { min-height:90px; resize:vertical; }
  textarea.small { min-height:50px; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--main); box-shadow:0 0 0 3px rgba(79,70,229,.2); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:10px 16px; border-radius:10px; border:1px solid transparent; font-size:15px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-main { background:var(--main); color:#fff; } .btn-main:hover:not(:disabled) { background:var(--main-d); }
  .btn-line { background:#fff; color:var(--main); border-color:var(--main); } .btn-line:hover { background:var(--soft); }
  .btn-gray { background:#f1f5f9; color:#334155; } .btn-gray:hover { background:#e2e8f0; }
  .btn-red { background:#fff; color:#dc2626; border-color:#fecaca; } .btn-red:hover { background:#fef2f2; }
  .btn-sm { padding:6px 10px; font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; min-width:160px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:700; }
  .b-on { background:#dcfce7; color:#15803d; } .b-wait { background:#fef9c3; color:#a16207; } .b-off { background:#f1f5f9; color:#64748b; }
  .period { display:inline-flex; gap:6px; align-items:center; background:var(--soft); color:var(--main-d); padding:6px 12px; border-radius:8px; font-size:14px; font-weight:600; }
  .list-item { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; background:#fff; flex-wrap:wrap; }
  .list-item.click { cursor:pointer; } .list-item.click:hover { border-color:var(--main); background:#fafaff; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:middle; margin-right:4px; }
  .msg { padding:12px 14px; border-radius:10px; font-size:14px; margin-top:14px; }
  .msg-err { background:#fee2e2; color:#b91c1c; } .msg-ok { background:#dcfce7; color:#15803d; } .msg-warn { background:#fef9c3; color:#854d0e; margin-top:0; margin-bottom:16px; }
  .q { border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:12px; background:#fff; }
  .q-title { font-weight:700; margin-bottom:6px; font-size:16px; }
  .q-desc { color:var(--sub); font-size:14px; white-space:pre-wrap; margin-bottom:10px; }
  .req { color:#dc2626; margin-left:2px; }
  .opt { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .opt:hover { background:#f8fafc; }
  .opt input { width:18px; height:18px; accent-color:var(--main); }
  .edit-opt { display:flex; gap:8px; margin-bottom:8px; }

  /* 표지/질문 사진 */
  .cover { width:100%; max-height:320px; object-fit:cover; border-radius:16px; display:block; margin-bottom:16px; }
  .q-img { max-width:100%; max-height:360px; border-radius:10px; display:block; margin:6px 0 12px; }
  .img-edit { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .img-edit img { height:72px; max-width:160px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .swatch { width:34px; height:34px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; }
  .swatch.on { box-shadow:0 0 0 3px var(--text); }

  /* 예/아니오 (O/X) */
  .yn { display:flex; gap:12px; }
  .yn label { flex:1; position:relative; cursor:pointer; }
  .yn input { position:absolute; opacity:0; pointer-events:none; }
  .yn .face { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; height:120px;
              border:2px solid var(--line); border-radius:14px; font-weight:700; font-size:17px; color:var(--sub); transition:all .15s; background:#fff; }
  .yn label:hover .face { border-color:#94a3b8; }
  .yn .mark { font-size:54px; line-height:1; font-weight:900; display:none; }
  .yn input:checked + .face { color:#fff; }
  .yn input:checked + .face .mark { display:block; }
  .yn input[value=O]:checked + .face { background:#2563eb; border-color:#2563eb; }
  .yn input[value=X]:checked + .face { background:#dc2626; border-color:#dc2626; }
  .yn input:focus-visible + .face { box-shadow:0 0 0 3px rgba(79,70,229,.35); }
  .ox { font-weight:900; } .ox-o { color:#2563eb; } .ox-x { color:#dc2626; }

  .bar-row { display:grid; grid-template-columns: 140px 1fr 80px; gap:10px; align-items:center; margin-bottom:8px; font-size:14px; }
  .bar-bg { background:#f1f5f9; border-radius:6px; height:22px; overflow:hidden; }
  .bar { background:var(--main); height:100%; border-radius:6px; }
  .bar.o { background:#2563eb; } .bar.x { background:#dc2626; }
  .answers { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  .answers div { padding:8px 12px; border-bottom:1px solid #f1f5f9; font-size:14px; }
  .answers div:last-child { border-bottom:none; }
  .answers b { color:var(--sub); font-weight:600; margin-right:6px; }
  .tbl-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { background:var(--soft); position:sticky; top:0; }
  td.wrap-txt { white-space:normal; min-width:180px; }
  .big { font-size:34px; font-weight:800; color:var(--main); }
  .done { text-align:center; padding:48px 24px; }
  .done .icon { font-size:56px; }
  .hidden { display:none !important; }
  footer { text-align:center; padding:20px; }
  footer a { color:#94a3b8; font-size:13px; text-decoration:none; } footer a:hover { text-decoration:underline; }
  .spinner { width:18px; height:18px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; }
  .loading { text-align:center; color:var(--sub); padding:40px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width:560px) { .bar-row { grid-template-columns: 90px 1fr 70px; } .yn .face { height:100px; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1 onclick="goHome()">📊 영재설문 응답 플랫폼</h1>
    <nav id="admin-nav" class="hidden">
      <button onclick="showAdmin()">설문 목록</button>
      <button onclick="showCreator()">+ 새 설문 만들기</button>
      <button onclick="logout()">로그아웃</button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"><div class="loading">불러오는 중...</div></main>

<footer><a href="#" onclick="showLogin();return false;">관리자</a></footer>

<script>
/* =========================================================
   ★ Apps Script 웹 앱 주소 ★
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbxgYG8JYBi8eKheaIf5slZH0KmdH2oSHgX0EJXp9T3h0gogiV-rHWwYH8BZuXd2N3KI7A/exec";

/* ---------------- 공통 ---------------- */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TYPE_NAME = {
  single:'객관식(하나 선택)', multiple:'객관식(여러 개 선택)', yesno:'예/아니오 (O/X)',
  short:'주관식(짧은 답)', long:'주관식(긴 답)'
};
const THEMES = ['#4f46e5', '#2563eb', '#0891b2', '#059669', '#65a30d', '#d97706', '#ea580c', '#e11d48', '#db2777', '#7c3aed', '#475569'];
const DEFAULT_THEME = '#4f46e5';
const hasOpts = t => t === 'single' || t === 'multiple';

async function api(action, data = {}) {
  if (!API_URL || API_URL.indexOf('script.google.com') === -1)
    throw new Error('아직 구글 시트와 연결되지 않았어요. index.html 위쪽의 API_URL에 Apps Script 웹 앱 주소를 넣어주세요.');
  let res;
  try {
    res = await fetch(API_URL, { method:'POST', body: JSON.stringify(Object.assign({ action }, data)) });
  } catch (e) {
    throw new Error('서버에 연결하지 못했어요. 인터넷 연결이나 웹 앱 배포 설정(액세스: 모든 사용자)을 확인해주세요.');
  }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('서버 응답을 읽지 못했어요. 웹 앱 주소가 맞는지, 최신 코드로 배포했는지 확인해주세요.'); }
  if (!j.ok) throw new Error(j.error || '오류가 발생했어요.');
  return j;
}

// 테마 색
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + (amt < 0 ? v * amt : (255 - v) * amt))));
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');
}
function applyTheme(c) {
  c = /^#[0-9a-f]{6}$/i.test(c || '') ? c : DEFAULT_THEME;
  const r = document.documentElement.style;
  r.setProperty('--main', c); r.setProperty('--main-d', shade(c, -0.15)); r.setProperty('--soft', shade(c, 0.9));
}

function badge(st) {
  const cls = st === '진행 중' ? 'b-on' : st === '예정' ? 'b-wait' : 'b-off';
  return `<span class="badge ${cls}">${esc(st)}</span>`;
}
function period(s) { return `<span class="period">🗓 ${esc(s.start)} ~ ${esc(s.end)}</span>`; }
function errBox(m) { return `<div class="msg msg-err">${esc(m)}</div>`; }
function loading(t) { app.innerHTML = `<div class="loading">${esc(t || '불러오는 중...')}</div>`; }
function busy(btn, on, text) {
  if (!btn) return;
  if (on) { btn.dataset.t = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>${esc(text || '처리 중...')}`; }
  else { btn.disabled = false; btn.innerHTML = btn.dataset.t || btn.innerHTML; }
}
function oxLabel(v) {
  return v === 'O' ? '<span class="ox ox-o">O</span>' : v === 'X' ? '<span class="ox ox-x">X</span>' : esc(v);
}

/* ---------------- 관리자 비밀번호 보관 (이 탭에서만) ---------------- */
let memPw = '';
function getPw() { try { return sessionStorage.getItem('admin_pw') || memPw; } catch (e) { return memPw; } }
function setPw(p) { memPw = p; try { p ? sessionStorage.setItem('admin_pw', p) : sessionStorage.removeItem('admin_pw'); } catch (e) {} }
function isAdmin() { return !!getPw(); }
function syncNav() { document.getElementById('admin-nav').classList.toggle('hidden', !isAdmin()); }
function setUrl(q) { history.replaceState(null, '', location.pathname + (q || '')); }

/* =========================================================
   참여자 화면
   ========================================================= */
async function goHome() {
  if (isAdmin()) return showAdmin();
  applyTheme(DEFAULT_THEME);
  setUrl('');
  loading();
  try {
    const { surveys } = await api('list');
    const open = surveys.filter(s => s.status !== '마감');
    app.innerHTML = `
      <div class="card">
        <h2>참여할 설문을 선택하세요</h2>
        <p class="sub" style="margin:0">진행 중인 설문에 참여할 수 있어요.</p>
      </div>
      ${open.length ? open.map(s => `
        <div class="list-item ${s.status === '진행 중' ? 'click' : ''}" ${s.status === '진행 중' ? `onclick="openSurvey('${esc(s.id)}')"` : ''}>
          <div class="grow">
            <div style="font-weight:700;font-size:17px;margin-bottom:6px"><span class="dot" style="background:${esc(s.theme)}"></span>${esc(s.title)} ${badge(s.status)}</div>
            ${period(s)}
          </div>
          ${s.status === '진행 중' ? `<button class="btn btn-main">참여하기 →</button>` : `<span class="sub">${esc(s.start)}부터 참여 가능</span>`}
        </div>`).join('') : `<div class="card sub" style="text-align:center">지금 참여할 수 있는 설문이 없어요.</div>`}`;
  } catch (e) { app.innerHTML = errBox(e.message); }
}

let current = null;   // 지금 응답 중인 설문
let currentImgs = {};
let who = null;       // { org, name }

async function openSurvey(id) {
  setUrl('?s=' + encodeURIComponent(id));
  loading();
  try {
    const r = await api('get', { id });
    current = r.survey; currentImgs = r.images || {}; who = null;
    applyTheme(current.theme);
    renderIntro();
  } catch (e) { app.innerHTML = errBox(e.message); }
}

function imgSrc(ref, map) { return !ref ? '' : ref.startsWith('img:') ? (map[ref] || '') : ref; }

function surveyHead(s) {
  const cover = imgSrc(s.cover, currentImgs);
  return `
    ${cover ? `<img class="cover" src="${esc(cover)}" alt="">` : ''}
    <div class="card" style="border-top:6px solid var(--main)">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">${esc(s.title)}</h2>${badge(s.status)}
      </div>
      ${s.desc ? `<p class="sub" style="white-space:pre-wrap;margin:10px 0 12px">${esc(s.desc)}</p>` : '<div style="height:12px"></div>'}
      ${period(s)}
    </div>`;
}

// 1단계: 소속 / 이름
function renderIntro() {
  const s = current;
  if (s.status !== '진행 중') {
    app.innerHTML = surveyHead(s) + `<div class="card" style="text-align:center">
      ${s.status === '예정' ? `아직 설문 기간이 아니에요.<br><b>${esc(s.start)}</b>부터 참여할 수 있어요.` : `설문 기간이 끝났어요. (${esc(s.end)} 마감)`}</div>`;
    return;
  }
  app.innerHTML = surveyHead(s) + `
    <div class="card">
      <h3>응답자 정보</h3>
      <p class="sub" style="margin-top:-6px">설문을 시작하기 전에 소속과 이름을 입력해주세요.</p>
      <label class="f">소속 <span class="req">*</span></label>
      <input type="text" id="in-org" placeholder="예: OO초등학교 5학년 3반" value="${esc(who?.org || '')}">
      <label class="f">이름 <span class="req">*</span></label>
      <input type="text" id="in-name" placeholder="예: 홍길동" value="${esc(who?.name || '')}">
      <div id="intro-msg"></div>
      <div style="margin-top:18px"><button class="btn btn-main" style="width:100%" onclick="startSurvey()">설문 시작하기 →</button></div>
    </div>`;
}

function startSurvey() {
  const org = document.getElementById('in-org').value.trim();
  const name = document.getElementById('in-name').value.trim();
  if (!org || !name) { document.getElementById('intro-msg').innerHTML = errBox('소속과 이름을 모두 입력해주세요.'); return; }
  who = { org, name };
  renderQuestions();
}

function questionInput(q, i) {
  if (hasOpts(q.type))
    return q.options.map(o => `<label class="opt"><input type="${q.type === 'single' ? 'radio' : 'checkbox'}" name="a-${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('');
  if (q.type === 'yesno')
    return `<div class="yn">
      <label><input type="radio" name="a-${i}" value="O"><span class="face"><span class="mark">O</span>예</span></label>
      <label><input type="radio" name="a-${i}" value="X"><span class="face"><span class="mark">X</span>아니오</span></label>
    </div>`;
  if (q.type === 'short') return `<input type="text" name="a-${i}" placeholder="답변을 입력하세요">`;
  return `<textarea name="a-${i}" placeholder="답변을 입력하세요"></textarea>`;
}

// 2단계: 질문 응답
function renderQuestions() {
  const s = current;
  app.innerHTML = surveyHead(s) + `
    <div class="card" style="padding:14px 20px">
      <span class="sub">응답자</span> <b>${esc(who.org)} · ${esc(who.name)}</b>
      <button class="btn btn-gray btn-sm" style="float:right" onclick="renderIntro()">수정</button>
    </div>
    ${s.questions.map((q, i) => {
      const img = imgSrc(q.image, currentImgs);
      return `
      <div class="q" id="q-${i}">
        <div class="q-title">${i + 1}. ${esc(q.text)}${q.required ? '<span class="req">*</span>' : ''}
          ${q.type === 'multiple' ? '<span class="sub" style="font-weight:400"> (여러 개 선택 가능)</span>' : ''}</div>
        ${q.desc ? `<div class="q-desc">${esc(q.desc)}</div>` : ''}
        ${img ? `<img class="q-img" src="${esc(img)}" alt="">` : ''}
        ${questionInput(q, i)}
      </div>`; }).join('')}
    <div id="submit-msg"></div>
    <button class="btn btn-main" id="submit-btn" style="width:100%;margin-top:8px;padding:14px" onclick="submitSurvey()">제출하기</button>`;
}

async function submitSurvey() {
  const s = current, msg = document.getElementById('submit-msg');
  msg.innerHTML = '';
  const answers = {};
  for (let i = 0; i < s.questions.length; i++) {
    const q = s.questions[i];
    let a;
    if (q.type === 'single' || q.type === 'yesno') a = (document.querySelector(`input[name="a-${i}"]:checked`) || {}).value || '';
    else if (q.type === 'multiple') a = [...document.querySelectorAll(`input[name="a-${i}"]:checked`)].map(x => x.value);
    else a = document.querySelector(`[name="a-${i}"]`).value.trim();
    const empty = Array.isArray(a) ? a.length === 0 : !a;
    if (q.required && empty) {
      msg.innerHTML = errBox(`${i + 1}번 질문에 답해주세요.`);
      document.getElementById('q-' + i).scrollIntoView({ behavior:'smooth', block:'center' });
      return;
    }
    answers[q.id] = a;
  }
  const btn = document.getElementById('submit-btn');
  busy(btn, true, '제출 중...');
  try {
    await api('submit', { id: s.id, org: who.org, name: who.name, answers });
    // 제출 후에는 결과를 보여주지 않음
    app.innerHTML = `
      <div class="card done">
        <div class="icon">✅</div>
        <h2>제출이 완료되었어요</h2>
        <p class="sub">${esc(who.org)} ${esc(who.name)}님, 설문에 참여해 주셔서 감사합니다.</p>
      </div>`;
    current = null; who = null;
    window.scrollTo(0, 0);
  } catch (e) {
    busy(btn, false);
    msg.innerHTML = errBox(e.message);
  }
}

/* =========================================================
   관리자 화면
   ========================================================= */
function showLogin() {
  if (isAdmin()) return showAdmin();
  applyTheme(DEFAULT_THEME);
  setUrl('?admin');
  app.innerHTML = `
    <div class="card" style="max-width:420px;margin:40px auto">
      <h2>관리자 로그인</h2>
      <p class="sub">설문 만들기와 결과 보기는 관리자만 할 수 있어요.</p>
      <label class="f">비밀번호</label>

// 사진 고르기 → 크기 줄이기
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('사진 파일만 넣을 수 있어요.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('사진을 읽지 못했어요.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('사진을 읽지 못했어요.'));
      img.onload = () => {
        let w = img.width, h = img.height; const max = 1200;
        if (w > max) { h = Math.round(h * max / w); w = max; }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        let q = 0.82, url = c.toDataURL('image/jpeg', q);
        while (url.length > 450000 && q > 0.4) { q -= 0.1; url = c.toDataURL('image/jpeg', q); }
        resolve(url);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function pickImage(onDone) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    try { onDone(await compressImage(inp.files[0])); renderCreator(); }
    catch (e) { alert(e.message); }
  };
  inp.click();
}

}
function moveQ(i, d) { const a = draft.questions; [a[i], a[i + d]] = [a[i + d], a[i]]; renderCreator(); }
function removeQ(i) {

  draft.questions.splice(i, 1); renderCreator();
}
function addOpt(i) { draft.questions[i].options.push(''); renderCreator(); }
function removeOpt(i, j) { draft.questions[i].options.splice(j, 1); renderCreator(); }

  else if (d.start > d.end) err = '종료일이 시작일보다 빠를 수 없어요.';

let lastResult = null;

function bars(entries, n, cls) {
  const max = Math.max(1, ...entries.map(e => e[1]));
  return entries.map(([label, c, html, k]) => `
    <div class="bar-row">
      <div title="${esc(label)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${html || esc(label)}</div>
      <div class="bar-bg"><div class="bar ${k || ''}" style="width:${c / max * 100}%"></div></div>
      <div><b>${c}</b>명 <span class="sub">${n ? Math.round(c / n * 100) : 0}%</span></div>
    </div>`).join('');
}

          <tr><th>제출일시</th><th>소속</th><th>이름</th>${s.questions.map((q, i) => `<th>${i + 1}. ${esc(q.text)}</th>`).join('')}</tr>
          ${rows.map(row => `<tr>${row.map((v, k) => `<td class="${k > 2 ? 'wrap-txt' : ''}">${k > 2 && s.questions[k - 3]?.type === 'yesno' ? oxLabel(v) : esc(v)}</td>`).join('')}</tr>`).join('')}
        </table></div>` : '<p class="sub">아직 응답이 없어요.</p>'}
      </div>`;
  } catch (e) { app.innerHTML = errBox(e.message); }
}

function downloadCsv() {
  if (!lastResult) return;
  const s = lastResult.survey;
  const header = ['제출일시', '소속', '이름'].concat(s.questions.map((q, i) => `${i + 1}. ${q.text}`));
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = '﻿' + [header].concat(lastResult.rows).map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = s.title.replace(/[\\/:*?"<>|]/g, '_') + '_응답.csv';
  a.click();
}

/* ---------------- 시작 ---------------- */
(function init() {
  syncNav();
  const p = new URLSearchParams(location.search);
  if (p.get('s')) openSurvey(p.get('s'));
  else if (p.has('admin')) showLogin();
  else goHome();
})();
</script>
