<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문 조사 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                📊 영재설문 응답 플랫폼
            </h1>
            <div class="space-x-2">
                <button onclick="switchTab('creator')" id="btn-creator" class="px-3 py-1.5 rounded-lg bg-indigo-700 font-medium text-sm transition">설문 만들기</button>
                <button onclick="switchTab('taker')" id="btn-taker" class="px-3 py-1.5 rounded-lg bg-indigo-500 font-medium text-sm transition">설문 참여하기</button>
                <button onclick="switchTab('results')" id="btn-results" class="px-3 py-1.5 rounded-lg bg-indigo-500 font-medium text-sm transition">결과 통계</button>
                <button onclick="openDeployModal()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 font-medium text-sm transition">깃허브 배포 가이드</button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">

        <!-- 1. Creator Tab -->
        <section id="tab-creator" class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 text-indigo-600">새로운 설문지 작성하기</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">설문 제목</label>
                        <input type="text" id="survey-title" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="예: 2026 초등영재교육 프로그램 만족도 조사">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">설문 설명</label>
                        <textarea id="survey-desc" class="w-full px-3 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="설문에 대한 안내 말씀을 작성해주세요."></textarea>
                    </div>
                </div>
            </div>

            <div id="questions-container" class="space-y-4">
                <!-- 질문들이 동적으로 추가되는 영역 -->
            </div>

            <div class="flex gap-3">
                <button onclick="addQuestion('single')" class="px-4 py-2 bg-white border border-indigo-600 text-indigo-600 rounded-xl font-medium hover:bg-indigo-50 transition">+ 객관식(단일)</button>
                <button onclick="addQuestion('multiple')" class="px-4 py-2 bg-white border border-indigo-600 text-indigo-600 rounded-xl
